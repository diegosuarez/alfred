[project]
name = "alfred-cli"
version = "0.1.0"
description = "Command-line client for Alfred (kanban / tasks / contexts)"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "tomli-w>=1.0",
    "questionary>=2.0",
]

[project.scripts]
alfred = "alfred_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alfred_cli"]
