server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's embedded DNS so the 'backend' upstream is re-resolved per
    # request. Without this nginx caches the IP at startup and any recreate of
    # the backend container turns every /api call into a 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # API → FastAPI. Redundant when a reverse proxy in front already routes
    # /api/ (see deploy/nginx/alfred.conf), but it keeps the container usable
    # on its own, e.g. straight against http://localhost:30005.
    location /api/ {
        set $backend_upstream "http://backend:8000";
        proxy_pass $backend_upstream;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # Attachments cap at 15 MB; leave room for the multipart envelope.
        client_max_body_size 20m;
    }

    # PWA: the entry document and the service worker must never be cached, or
    # clients keep booting an old bundle after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
    }
    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        types { } default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    # Vite fingerprints these filenames, so they're safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # SPA fallback. Also what keeps scanner traffic (/Dockerfile, /.env,
    # /vendor/...) from reaching anything but index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
