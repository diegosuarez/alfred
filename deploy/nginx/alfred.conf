# Alfred — nginx vhost template.
# Terminates TLS via Let's Encrypt, proxies /api to the FastAPI backend
# and / to the nginx that serves the built SPA inside docker-compose.
#
# `__DOMAIN__` and `__SSL_CERT_DIR__` are substituted by deploy/deploy.sh
# when this file is installed into /etc/nginx/sites-available.

server {
    listen 80;
    server_name __DOMAIN__;

    # Certbot challenge stays on plain HTTP; everything else upgrades.
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__SSL_CERT_DIR__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__SSL_CERT_DIR__/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # Allow attachment uploads up to 15 MB plus multipart envelope.
    client_max_body_size 20m;

    # API → FastAPI on the host.
    location /api/ {
        proxy_pass http://127.0.0.1:30004;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # SPA → the frontend container's nginx, which serves the static build
    # and applies the cache headers (see frontend/nginx.conf).
    location / {
        proxy_pass http://127.0.0.1:30005;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
