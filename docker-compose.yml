services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "30004:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    env_file:
      # Gitignored; holds Google OAuth credentials and other host-specific
      # overrides. Copy backend/.env.example to backend/.env to populate it.
      - ./backend/.env
    environment:
      # Absolute path inside the container (4 slashes => absolute in SQLAlchemy URL).
      - DATABASE_URL=sqlite+aiosqlite:////app/data/alfred.db
      # CORS_ORIGINS comes from backend/.env (see env_file above). The
      # backend falls back to localhost dev origins if it's unset.
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "30005:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Vite proxies /api/* to this URL during dev (see vite.config.ts).
      - VITE_PROXY_TARGET=http://backend:8000
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
