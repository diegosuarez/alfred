# Production stack. Code lives in the images; only mutable state is mounted.
#
# For local development with hot reload, layer the dev overrides on top:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# The dev file is NOT named docker-compose.override.yml on purpose — Compose
# would pick it up implicitly and quietly put deployments back into dev mode.
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "30004:8000"
    volumes:
      # State only: SQLite DB, task attachments, VAPID/FCM keys. Same host
      # path the stack has always used, so nothing moves.
      - ./backend/data:/app/data
    env_file:
      # Gitignored; holds Google OAuth credentials and other host-specific
      # overrides. Copy backend/.env.example to backend/.env to populate it.
      - ./backend/.env
    environment:
      # Absolute path inside the container (4 slashes => absolute in SQLAlchemy URL).
      - DATABASE_URL=sqlite+aiosqlite:////app/data/alfred.db
      # CORS_ORIGINS comes from backend/.env (see env_file above). The
      # backend falls back to localhost dev origins if it's unset.
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # Static build served by nginx inside the container; it also proxies
    # /api/ to the backend so the container works on its own.
    ports:
      - "30005:80"
    depends_on:
      - backend
    restart: unless-stopped
