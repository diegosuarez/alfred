services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "30000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    env_file:
      # Gitignored; holds Google OAuth credentials and other host-specific
      # overrides. Copy backend/.env.example to backend/.env to populate it.
      - ./backend/.env
    environment:
      # Absolute path inside the container (4 slashes => absolute in SQLAlchemy URL).
      - DATABASE_URL=sqlite+aiosqlite:////app/data/alfred.db
      - CORS_ORIGINS=http://localhost:30001,http://127.0.0.1:30001
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "30001:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:30000
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0
